<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>벧엘한인장로교회 주보 | Weekly Bulletin</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071426;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    .bulletin-viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #071426;
      touch-action: none;
      user-select: none;
    }

    .bulletin-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      transform: scale(var(--image-scale, 1));
      transform-origin: center center;
      transition: opacity 0.18s ease, transform 0.18s ease;
      -webkit-user-drag: none;
    }

    .bulletin-image.is-changing {
      opacity: 0;
    }

    .nav-button {
      position: absolute;
      top: 50%;
      z-index: 2;
      width: 36px;
      height: 54px;
      border: 0;
      border-radius: 6px;
      color: #ffffff;
      background: rgba(7, 20, 38, 0.56);
      font-size: 30px;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      transform: translateY(-50%);
      transition: background-color 0.2s ease;
    }

    .nav-button:hover,
    .nav-button:focus-visible {
      background: rgba(7, 20, 38, 0.86);
      outline: 2px solid rgba(255, 255, 255, 0.9);
      outline-offset: 2px;
    }

    .nav-prev {
      left: 18px;
    }

    .nav-next {
      right: 18px;
    }

    .page-indicator {
      position: absolute;
      left: 50%;
      bottom: 14px;
      z-index: 2;
      padding: 7px 12px;
      border-radius: 999px;
      color: #ffffff;
      background: rgba(7, 20, 38, 0.68);
      font-size: 13px;
      letter-spacing: 0.5px;
      transform: translateX(-50%);
    }

    @media (max-width: 700px) {
      .nav-button {
        width: 32px;
        height: 48px;
        font-size: 26px;
        background: rgba(7, 20, 38, 0.48);
      }

      .nav-prev {
        left: 8px;
      }

      .nav-next {
        right: 8px;
      }

      .page-indicator {
        bottom: 10px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="bulletin-viewer" id="bulletinViewer" aria-label="주보 이미지 보기">
    <img
      class="bulletin-image"
      id="bulletinImage"
      src="1-3.jpg"
      alt="주보 1페이지">

    <button class="nav-button nav-prev" id="prevButton" type="button" aria-label="이전 페이지">‹</button>
    <button class="nav-button nav-next" id="nextButton" type="button" aria-label="다음 페이지">›</button>

    <div class="page-indicator" id="pageIndicator" aria-live="polite">1 / 6</div>
  </main>

  <script src="../assets/script/weekly_bulletin_index.js"></script>
</body>
</html>
