<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>벧엘한인장로교회 | Korean Bethel Presbyterian Church | Fayetteville NC</title>

  <meta name="description"
        content="벧엘한인장로교회 Korean Bethel Presbyterian Church는 Fayetteville, North Carolina 지역의 한인 교회입니다. 말씀과 예배, 다음세대, 선교를 통해 하나님의 은혜를 나누는 교회입니다.">

  <meta name="keywords"
        content="Fayetteville Korean Church, Korean Church Fayetteville NC, Fayetteville NC Korean Church, 벧엘한인장로교회, Korean Bethel Presbyterian Church">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        Arial,
        sans-serif;
      color: #ffffff;
      background: #111;
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;

      /*
        church.jpg 파일을 repository에 올리면
        아래 배경으로 사용됩니다.
      */
      background:
        linear-gradient(
          rgba(9, 20, 31, 0.45),
          rgba(9, 20, 31, 0.68)
        ),
        url("church.jpg") center center / cover no-repeat;
    }

    /* 위쪽 교회명 */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 28px 50px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      z-index: 10;
    }

    .church-name {
      text-align: left;
      line-height: 1.25;
    }

    .church-name .ko {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .church-name .en {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .nav-link {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255,255,255,0.55);
      padding-bottom: 4px;
    }

    /* 중앙 콘텐츠 */
    .hero-content {
      max-width: 950px;
      margin-top: 30px;
    }

    .small-title {
      font-size: 14px;
      letter-spacing: 4px;
      margin-bottom: 25px;
      opacity: 0.9;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(52px, 8vw, 105px);
      font-weight: 400;
      line-height: 0.98;
      letter-spacing: -3px;
      margin-bottom: 30px;
    }

    h1 .ko {
      display: block;
      font-family:
        "Noto Serif KR",
        Georgia,
        serif;

      font-size: 0.56em;
      letter-spacing: -2px;
      margin-bottom: 16px;
    }

    .verse {
      font-size: 16px;
      line-height: 1.9;
      margin-bottom: 42px;
      color: rgba(255,255,255,0.92);
    }

    .verse span {
      display: block;
      margin-top: 5px;
      font-size: 13px;
      opacity: 0.7;
    }

    /* 버튼 */
    .buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 170px;
      height: 52px;

      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.4px;

      transition: 0.25s ease;
    }

    .btn-primary {
      background: #ffffff;
      color: #172436;
      border: 1px solid #ffffff;
    }

    .btn-primary:hover {
      background: rgba(255,255,255,0.88);
    }

    .btn-outline {
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.04);
    }

    .btn-outline:hover {
      background: #ffffff;
      color: #172436;
    }

    /* 하단 정보 */
    .bottom-info {
      position: absolute;
      bottom: 32px;
      left: 0;
      width: 100%;

      display: flex;
      justify-content: center;
      gap: 35px;

      font-size: 12px;
      letter-spacing: 0.5px;
      opacity: 0.78;
    }

    /* MOBILE */
    @media (max-width: 700px) {

      .header {
        padding: 22px 20px;
      }

      .church-name .ko {
        font-size: 15px;
      }

      .church-name .en {
        font-size: 8px;
        letter-spacing: 0.8px;
      }

      .nav-link {
        font-size: 12px;
      }

      h1 {
        letter-spacing: -2px;
      }

      .small-title {
        font-size: 11px;
        letter-spacing: 3px;
      }

      .verse {
        font-size: 14px;
      }

      .buttons {
        flex-direction: column;
        align-items: center;
      }

      .btn {
        width: 230px;
      }

      .bottom-info {
        bottom: 20px;
        flex-direction: column;
        gap: 5px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <!-- 상단 -->
    <header class="header">

      <div class="church-name">
        <div class="ko">벧엘한인장로교회</div>

        <div class="en">
          Korean Bethel Presbyterian Church
        </div>
      </div>

      <a
        href="https://www.bethelkrchurch.org/"
        target="_blank"
        rel="noopener"
        class="nav-link">
        교회 홈페이지 →
      </a>

    </header>


    <!-- 중앙 -->
    <main class="hero-content">

      <div class="small-title">
        2026 CHURCH THEME
      </div>

      <h1>
        <span class="ko">더하시는 은혜</span>
        Grace Upon Grace
      </h1>

      <div class="verse">
        “우리가 다 그의 충만한 데서 받으니 은혜 위에 은혜러라”

        <span>
          JOHN 1:16
        </span>
      </div>

      <div class="buttons">

        <a
          href="https://www.bethelkrchurch.org/"
          target="_blank"
          rel="noopener"
          class="btn btn-primary">
          교회 둘러보기
        </a>

        <a
          href="https://www.bethelkrchurch.org/board/list.do?iboardmanagerseq=8"
          target="_blank"
          rel="noopener"
          class="btn btn-outline">
          예배와 말씀
        </a>

      </div>

    </main>


    <!-- 하단 -->
    <div class="bottom-info">

      <div>
        FAYETTEVILLE, NORTH CAROLINA
      </div>

      <div>
        KOREAN BETHEL PRESBYTERIAN CHURCH
      </div>

    </div>

  </section>

</body>
</html>
